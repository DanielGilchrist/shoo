Lint/DebugCalls:
  Excluded:
    - src/shoo/debug.cr

Documentation/DocumentationAdmonition:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Performance/AnyInsteadOfEmpty:
  Enabled: false

Typing/MethodParameterTypeRestriction:
  Enabled: true
  DefaultValue: true
  BlockParameters: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/MethodReturnTypeRestriction:
  Enabled: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/ProcLiteralReturnTypeRestriction:
  Enabled: true

Typing/MacroCallArgumentTypeRestriction:
  Enabled: true
